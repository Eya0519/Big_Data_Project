input {
  file {
    path => "/data/csv/*.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"
    discover_interval => 2
    stat_interval => 1
  }
}

filter {
  ruby {
    code => 'p = event.get("[log][file][path]") || event.get("path"); event.set("source_file", File.basename(p)) if p'
  }
  csv {
    separator => ","
    skip_header => true
    columns => ["timestamp","ip_source","utilisateur","type_evenement","resultat","niveau","ressource","service","description"]
  }
  if "_csvparsefailure" not in [tags] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
    geoip {
      source => "ip_source"
      target => "geoip"
      ecs_compatibility => disabled
    }
    mutate {
      add_tag => ["csv_import"]
      remove_field => ["message","host","log","event","@version"]
    }
  }
}

output {
  if "_csvparsefailure" in [tags] or "_dateparsefailure" in [tags] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "logs_parse_errors" }
  } else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "security_logs-%{+YYYY.MM}" }
  }
}
