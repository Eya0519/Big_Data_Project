input {
  file {
    path => "/data/json/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_json"
    discover_interval => 2
    stat_interval => 1
    codec => "json"
  }
}

filter {
  ruby {
    code => 'p = event.get("[log][file][path]") || event.get("path"); event.set("source_file", File.basename(p)) if p'
  }
  if "_jsonparsefailure" not in [tags] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
    geoip {
      source => "ip_source"
      target => "geoip"
      ecs_compatibility => disabled
    }
    mutate {
      add_tag => ["json_import"]
      remove_field => ["host","log","event","@version"]
    }
  }
}

output {
  if "_jsonparsefailure" in [tags] or "_dateparsefailure" in [tags] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "logs_parse_errors" }
  } else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "security_logs-%{+YYYY.MM}" }
  }
}
