name: elk-security

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    container_name: es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    networks: [elk-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.23
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports: ["5601:5601"]
    networks: [elk-net]
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 60s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.23
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - XPACK_MONITORING_ENABLED=false
    volumes:
      - ./logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./data:/data:ro
      - logstashdata:/usr/share/logstash/data 
    networks: [elk-net]
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600 > /dev/null"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 40s

  mongo:
    image: mongo:7
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    networks: [elk-net]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-bookworm
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports: ["6379:6379"]
    networks: [elk-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  webapp:
    build: ./webapp
    container_name: webapp
    environment:
      ES_HOST: http://elasticsearch:9200
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      UPLOAD_DIR: /data
    ports: ["8000:8000"]
    volumes: [./data:/data]          # read-write: Flask will save uploads here in week 4
    networks: [elk-net]
    depends_on:
      elasticsearch: {condition: service_healthy}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  elk-net:
    driver: bridge

volumes:
  esdata:
  mongodata:
  logstashdata:
